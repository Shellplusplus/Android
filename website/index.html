<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shell++ 更新检查</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus/dist/index.css">
  <style>
    body { margin: 0; background: #f5f7fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    [v-cloak] { display: none !important; }
    .changelog-preview {
      font-size: 14px; line-height: 1.6; color: #303133; word-wrap: break-word; overflow-wrap: break-word;
      display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden;
    }
    .changelog-more { color: #409eff; font-size: 13px; margin-top: 4px; cursor: pointer; }
    .changelog-more:hover { color: #337ecc; }
    .changelog-full { font-size: 14px; line-height: 1.8; color: #303133; word-wrap: break-word; overflow-wrap: break-word; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="app" v-cloak style="width:100%;max-width:400px;padding:20px">
    <el-card v-loading="loading">
      <template #header>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:18px;font-weight:600">{{ info.app_name }}</span>
          <el-tag :type="hasUpdate ? 'warning' : 'success'" size="small">{{ hasUpdate ? '有更新' : '已是最新' }}</el-tag>
        </div>
      </template>

      <el-descriptions :column="1" border size="small">
        <el-descriptions-item label="最新版本">{{ info.latest_version }}</el-descriptions-item>
        <el-descriptions-item label="当前版本">{{ currentVersion || '未安装' }}</el-descriptions-item>
        <el-descriptions-item label="发布日期">{{ info.release_date }}</el-descriptions-item>
      </el-descriptions>

      <div style="margin-top:16px">
        <div style="font-size:13px;color:#909399;margin-bottom:6px">更新内容</div>
        <div class="changelog-preview">{{ info.changelog || '暂无' }}</div>
        <div v-if="info.changelog" class="changelog-more" v-on:click="dialogVisible = true">......查看更多</div>
      </div>

      <div style="margin-top:20px;display:flex;gap:10px">
        <el-button v-on:click="fetchData" :loading="loading" style="flex:1">刷新</el-button>
        <el-button type="primary" :disabled="!hasUpdate" v-on:click="goDownload" style="flex:1">
          {{ hasUpdate ? '立即更新' : '暂无更新' }}
        </el-button>
      </div>
    </el-card>

    <el-dialog v-model="dialogVisible" width="400px" :show-close="true" style="border-radius:2px;max-width:90vw">
      <template #header>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:20px;font-weight:600">更新内容</span>
        </div>
      </template>
      <div class="changelog-full">{{ info.changelog || '暂无' }}</div>
    </el-dialog>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus"></script>
  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    createApp({
      setup() {
        const loading = ref(true);
        const info = ref({});
        const currentVersionCode = ref(0);
        const dialogVisible = ref(false);

        const hasUpdate = computed(() => currentVersionCode.value < (info.value.latest_version_code || 0));
        const currentVersion = computed(() => currentVersionCode.value ? 'beta' + currentVersionCode.value : '');

        async function fetchData() {
          loading.value = true;
          try {
            const res = await fetch('api.php?t=' + Date.now());
            info.value = await res.json();
            currentVersionCode.value = Number(localStorage.getItem('shell_current_version_code') || 0);
          } catch { info.value = { app_name: 'Shell++', changelog: '获取失败' }; }
          loading.value = false;
        }

        function goDownload() { if (info.value.download_url) window.open(info.value.download_url); }

        onMounted(fetchData);
        return { loading, info, hasUpdate, currentVersion, dialogVisible, fetchData, goDownload };
      }
    }).use(ElementPlus).mount('#app');
  </script>
</body>
</html>
