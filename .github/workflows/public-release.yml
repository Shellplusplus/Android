name: Public release artifact
run-name: Public release ${{ inputs.task_id }} from ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Tag, branch, or commit to build
        required: true
        type: string
      task_id:
        description: Release Center task ID
        required: true
        type: string
      public_release_title:
        description: Unified public Release title
        required: true
        type: string
      app_version:
        description: Android version name (x.y.z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out requested source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Decode signing keystore
        run: |
          mkdir -p sign
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > sign/Android.jks
      - name: Create local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "shell.storePassword=${{ secrets.STORE_PASSWORD }}" >> local.properties
          echo "shell.keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "shell.keyPassword=${{ secrets.KEY_PASSWORD }}" >> local.properties
          echo "shell.aiIssuerPublicKey=${{ secrets.AI_LICENSE_ISSUER_PUBLIC_KEY }}" >> local.properties
      - run: chmod +x gradlew
      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.app_version }}
      - name: Upload Release Center artifact
        uses: actions/upload-artifact@v6
        with:
          name: shellpp-apk-${{ inputs.task_id }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
