name: Build & Release APK

on:
  push:
    branches: [ android ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > sign/Android.jks

      - name: Create local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "shell.storePassword=${{ secrets.STORE_PASSWORD }}" >> local.properties
          echo "shell.keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "shell.keyPassword=${{ secrets.KEY_PASSWORD }}" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "beta${{ github.run_number }}"

      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s" -20)
          else
            LOG=$(git log --pretty=format:"- %s" ${LAST_TAG}..HEAD)
          fi
          if [ -z "$LOG" ]; then
            LOG="- 首次发布"
          fi
          echo "log<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta${{ github.run_number }}
          name: "Shell++ beta${{ github.run_number }}"
          body: |
            ## Shell++ beta${{ github.run_number }}

            ### 更新内容
            ${{ steps.changelog.outputs.log }}

            ### 安装说明
            下载下方 APK 文件，直接安装即可。
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: true
