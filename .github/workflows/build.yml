name: Build & Release APK

on:
  push:
    branches: [ android ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > sign/Android.jks

      - name: Create local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "shell.storePassword=${{ secrets.STORE_PASSWORD }}" >> local.properties
          echo "shell.keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "shell.keyPassword=${{ secrets.KEY_PASSWORD }}" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "beta${{ github.run_number }}"

      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s" -20)
          else
            LOG=$(git log --pretty=format:"- %s" ${LAST_TAG}..HEAD)
          fi
          if [ -z "$LOG" ]; then
            LOG="- 首次发布"
          fi
          echo "log<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/standard/release/*.apk
            app/build/outputs/apk/developer/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Create public download release
        uses: softprops/action-gh-release@v2
        with:
          repository: DefateStar/public-shellpp
          token: ${{ secrets.PUBLIC_SHELLPP_TOKEN }}
          tag_name: beta${{ github.run_number }}
          name: "Shell++ beta${{ github.run_number }}"
          body: |
            ## Shell++ beta${{ github.run_number }}

            ### 更新内容
            ${{ steps.changelog.outputs.log }}

            ### 安装说明
            下载下方 APK 文件，直接安装即可。
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/standard/release/*.apk
            app/build/outputs/apk/developer/release/*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true

      - name: Notify QQ group
        if: always() && github.event_name == 'push'
        env:
          WEBHOOK_URL: ${{ secrets.QQ_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.QQ_WEBHOOK_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "QQ_WEBHOOK_URL is not configured, skip QQ notification."
            exit 0
          fi

          COMMIT_MESSAGE="$(git log -1 --pretty=%s)"
          COMMIT_AUTHOR="$(git log -1 --pretty=%an)"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          COMPARE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${{ github.event.before }}...${GITHUB_SHA}"

          PAYLOAD="$(jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg sha "$GITHUB_SHA" \
            --arg actor "$GITHUB_ACTOR" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg run_number "$GITHUB_RUN_NUMBER" \
            --arg run_url "$RUN_URL" \
            --arg commit_message "$COMMIT_MESSAGE" \
            --arg commit_author "$COMMIT_AUTHOR" \
            --arg compare_url "$COMPARE_URL" \
            --arg status "$JOB_STATUS" \
            '{
              repository: $repository,
              branch: $branch,
              sha: $sha,
              actor: $actor,
              event_name: $event_name,
              workflow: $workflow,
              run_number: $run_number,
              run_url: $run_url,
              commit_message: $commit_message,
              commit_author: $commit_author,
              compare_url: $compare_url,
              status: $status
            }')"

          if ! curl -fsS -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Token: $WEBHOOK_TOKEN" \
            --data "$PAYLOAD"; then
            echo "QQ notification failed, but build result is kept unchanged."
          fi
