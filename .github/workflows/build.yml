name: Build & Release APK

on:
  push:
    branches:
      - main
      - android
  workflow_dispatch:
    inputs:
      release_repository:
        description: Override target release repository (owner/repo)
        required: false
        type: string

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "11076708"
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validate build secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured."
              exit 1
            fi
          done

      - name: Configure signing and local properties
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          AI_LICENSE_ISSUER_PUBLIC_KEY: ${{ secrets.AI_LICENSE_ISSUER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          mkdir -p sign
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > sign/Android.jks
          {
            printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT"
            printf 'shell.storePassword=%s\n' "$STORE_PASSWORD"
            printf 'shell.keyAlias=%s\n' "$KEY_ALIAS"
            printf 'shell.keyPassword=%s\n' "$KEY_PASSWORD"
            if [ -n "$AI_LICENSE_ISSUER_PUBLIC_KEY" ]; then
              printf 'shell.aiIssuerPublicKey=%s\n' "$AI_LICENSE_ISSUER_PUBLIC_KEY"
            fi
          } > local.properties
          chmod +x gradlew

      - name: Build release APK
        shell: bash
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: beta${{ github.run_number }}
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:assembleRelease

      - name: Verify release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release APK, found ${#files[@]}."
            printf '%s\n' "${files[@]:-}"
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${files[0]}")" >> "$GITHUB_OUTPUT"
          ls -lh "${files[0]}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Resolve release target
        id: release
        shell: bash
        env:
          REQUESTED_REPOSITORY: ${{ inputs.release_repository || '' }}
          EXTERNAL_TOKEN: ${{ secrets.PUBLIC_SHELLPP_TOKEN }}
        run: |
          set -euo pipefail
          target="$(printf '%s' "$REQUESTED_REPOSITORY" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$target" ]; then
            target="$GITHUB_REPOSITORY"
          fi
          if ! printf '%s' "$target" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "::error::Invalid release repository '$target'. Expected owner/repo."
            exit 1
          fi
          external=false
          if [ "$target" != "$GITHUB_REPOSITORY" ]; then
            external=true
            if [ -z "$EXTERNAL_TOKEN" ]; then
              echo "::error::PUBLIC_SHELLPP_TOKEN is required for external repository '$target'."
              exit 1
            fi
          fi
          tag="beta${GITHUB_RUN_NUMBER}"
          {
            echo "repository=$target"
            echo "external=$external"
            echo "tag=$tag"
            echo "title=Shell++ $tag"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        shell: bash
        env:
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: |
          set -euo pipefail
          previous_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$previous_tag" ]; then
            changes="$(git log --pretty=format:'- %s' "$previous_tag"..HEAD)"
          else
            changes="$(git log --pretty=format:'- %s' -20)"
          fi
          if [ -z "$changes" ]; then
            changes='- 首次发布'
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "## $RELEASE_TITLE"
            echo
            echo '### 更新内容'
            echo "$changes"
            echo
            echo '### 安装说明'
            echo '下载下方 APK 文件，直接安装即可。'
          } > "$notes"
          echo "path=$notes" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release.outputs.external == 'true' && secrets.PUBLIC_SHELLPP_TOKEN || github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          TARGET_REPOSITORY: ${{ steps.release.outputs.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_NOTES: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail
          target_args=()
          if [ "$TARGET_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
            target_args=(--target "$GITHUB_SHA")
          fi
          if gh release view "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH" --repo "$TARGET_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$TARGET_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes-file "$RELEASE_NOTES"
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --repo "$TARGET_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes-file "$RELEASE_NOTES" \
              --latest \
              "${target_args[@]}"
          fi

      - name: Notify QQ group
        if: always() && github.event_name == 'push'
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.QQ_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.QQ_WEBHOOK_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -u
          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo 'QQ_WEBHOOK_URL is not configured; skipping notification.'
            exit 0
          fi
          payload="$(jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg sha "$GITHUB_SHA" \
            --arg actor "$GITHUB_ACTOR" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg run_number "$GITHUB_RUN_NUMBER" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg commit_message "$(git log -1 --pretty=%s)" \
            --arg commit_author "$(git log -1 --pretty=%an)" \
            --arg status "$JOB_STATUS" \
            '{repository:$repository,branch:$branch,sha:$sha,actor:$actor,workflow:$workflow,run_number:$run_number,run_url:$run_url,commit_message:$commit_message,commit_author:$commit_author,status:$status}')"
          if ! curl --fail --silent --show-error -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -H "X-Webhook-Token: $WEBHOOK_TOKEN" \
            --data "$payload"; then
            echo 'QQ notification failed; preserving the build result.'
          fi
