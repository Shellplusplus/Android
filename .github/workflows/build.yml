name: Build & Release APK

on:
  push:
    branches: [ main, android ]
  workflow_dispatch:
    inputs:
      release_repository:
        description: "Override target release repository (owner/repo)"
        required: false
        type: string

env:
  DEFAULT_PUBLIC_RELEASE_REPOSITORY: DefateStar/public-shellpp

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode keystore
        run: |
          mkdir -p sign
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > sign/Android.jks

      - name: Create local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "shell.storePassword=${{ secrets.STORE_PASSWORD }}" >> local.properties
          echo "shell.keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "shell.keyPassword=${{ secrets.KEY_PASSWORD }}" >> local.properties
          echo "shell.aiIssuerPublicKey=${{ secrets.AI_LICENSE_ISSUER_PUBLIC_KEY }}" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "beta${{ github.run_number }}"

      - name: Prepare release target
        id: release_target
        env:
          DEFAULT_PUBLIC_RELEASE_REPOSITORY: ${{ env.DEFAULT_PUBLIC_RELEASE_REPOSITORY }}
          INPUT_RELEASE_REPOSITORY: ${{ github.event.inputs.release_repository || '' }}
          PUBLIC_RELEASE_REPOSITORY: ${{ vars.PUBLIC_RELEASE_REPOSITORY }}
          PUBLIC_SHELLPP_TOKEN: ${{ secrets.PUBLIC_SHELLPP_TOKEN }}
        run: |
          trim() {
            printf '%s' "$1" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TARGET_REPOSITORY="$GITHUB_REPOSITORY"
          else
            TARGET_REPOSITORY="$(trim "${INPUT_RELEASE_REPOSITORY:-}")"
            if [ -z "$TARGET_REPOSITORY" ]; then
              TARGET_REPOSITORY="$GITHUB_REPOSITORY"
            fi
          fi

          if ! printf '%s' "$TARGET_REPOSITORY" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "::error::Invalid release repository '$TARGET_REPOSITORY'. Expected owner/repo."
            exit 1
          fi

          RELEASE_TAG="beta${GITHUB_RUN_NUMBER}"
          RELEASE_NAME="Shell++ ${RELEASE_TAG}"

          if [ "$TARGET_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
            EXTERNAL_REPOSITORY=false
            TOKEN_SOURCE="github.token"
          else
            EXTERNAL_REPOSITORY=true
            TOKEN_SOURCE="secrets.PUBLIC_SHELLPP_TOKEN"
            if [ -z "${PUBLIC_SHELLPP_TOKEN:-}" ]; then
              echo "::error::PUBLIC_SHELLPP_TOKEN is required when publishing to external repository '$TARGET_REPOSITORY'."
              exit 1
            fi
          fi

          {
            echo "repository=$TARGET_REPOSITORY"
            echo "tag=$RELEASE_TAG"
            echo "name=$RELEASE_NAME"
            echo "external_repo=$EXTERNAL_REPOSITORY"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release target"
            echo ""
            echo "- Source repository: \`$GITHUB_REPOSITORY\`"
            echo "- Target repository: \`$TARGET_REPOSITORY\`"
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Token source: \`$TOKEN_SOURCE\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate release notes
        id: changelog
        env:
          RELEASE_TAG: ${{ steps.release_target.outputs.tag }}
          RELEASE_NAME: ${{ steps.release_target.outputs.name }}
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s" -20)
          else
            LOG=$(git log --pretty=format:"- %s" ${LAST_TAG}..HEAD)
          fi
          if [ -z "$LOG" ]; then
            LOG="- 首次发布"
          fi

          BODY_PATH="$RUNNER_TEMP/release-notes.md"
          {
            echo "## ${RELEASE_NAME}"
            echo ""
            echo "### 更新内容"
            echo "$LOG"
            echo ""
            echo "### 安装说明"
            echo "下载下方 APK 文件，直接安装即可。"
          } > "$BODY_PATH"

          echo "body_path=$BODY_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: List built APK files
        # Keep this for runner-side path debugging when artifact layouts change.
        run: find app/build/outputs/apk -type f | sort

      - name: Publish release
        env:
          GH_TOKEN: ${{ steps.release_target.outputs.external_repo == 'true' && secrets.PUBLIC_SHELLPP_TOKEN || github.token }}
          TARGET_REPOSITORY: ${{ steps.release_target.outputs.repository }}
          RELEASE_TAG: ${{ steps.release_target.outputs.tag }}
          RELEASE_NAME: ${{ steps.release_target.outputs.name }}
          RELEASE_BODY_PATH: ${{ steps.changelog.outputs.body_path }}
        run: |
          mapfile -t APK_FILES < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort)
          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "::error::No release APK files were found."
            exit 1
          fi

          TARGET_ARGS=()
          if [ "$TARGET_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
            TARGET_ARGS+=(--target "$GITHUB_SHA")
          fi

          if gh release view "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" >/dev/null 2>&1; then
            LATEST_ARGS=(--latest)
            if [ "$(gh release view "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = "true" ]; then
              LATEST_ARGS=()
              echo "::notice::Release '$RELEASE_TAG' is draft or prerelease; skip marking it as latest."
            fi

            gh release upload "$RELEASE_TAG" "${APK_FILES[@]}" --repo "$TARGET_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$TARGET_REPOSITORY" \
              --title "$RELEASE_NAME" \
              --notes-file "$RELEASE_BODY_PATH" \
              "${LATEST_ARGS[@]}"
          else
            gh release create "$RELEASE_TAG" \
              "${APK_FILES[@]}" \
              --repo "$TARGET_REPOSITORY" \
              --title "$RELEASE_NAME" \
              --notes-file "$RELEASE_BODY_PATH" \
              --latest \
              "${TARGET_ARGS[@]}"
          fi

      - name: Notify QQ group
        if: always() && github.event_name == 'push'
        env:
          WEBHOOK_URL: ${{ secrets.QQ_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.QQ_WEBHOOK_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "QQ_WEBHOOK_URL is not configured, skip QQ notification."
            exit 0
          fi

          COMMIT_MESSAGE="$(git log -1 --pretty=%s)"
          COMMIT_AUTHOR="$(git log -1 --pretty=%an)"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          COMPARE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${{ github.event.before }}...${GITHUB_SHA}"

          PAYLOAD="$(jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg sha "$GITHUB_SHA" \
            --arg actor "$GITHUB_ACTOR" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg run_number "$GITHUB_RUN_NUMBER" \
            --arg run_url "$RUN_URL" \
            --arg commit_message "$COMMIT_MESSAGE" \
            --arg commit_author "$COMMIT_AUTHOR" \
            --arg compare_url "$COMPARE_URL" \
            --arg status "$JOB_STATUS" \
            '{
              repository: $repository,
              branch: $branch,
              sha: $sha,
              actor: $actor,
              event_name: $event_name,
              workflow: $workflow,
              run_number: $run_number,
              run_url: $run_url,
              commit_message: $commit_message,
              commit_author: $commit_author,
              compare_url: $compare_url,
              status: $status
            }')"

          if ! curl -fsS -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Token: $WEBHOOK_TOKEN" \
            --data "$PAYLOAD"; then
            echo "QQ notification failed, but build result is kept unchanged."
          fi
